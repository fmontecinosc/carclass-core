<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carclass Core</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#006039">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carclass Core">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="96x96" href="img/core-96.png">
<link rel="apple-touch-icon" href="img/core-180.png">
<style>
/* Pantalla de apertura: se ve mientras carga la app y se desvanece al primer render */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(120% 90% at 38% 28%,#126e48 0%,#0a4a31 45%,#04241a 100%);transition:opacity .45s ease}
#splash.fuera{opacity:0;pointer-events:none}
#splash .sp-disco{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;border:2px solid #c9a85c;
  box-shadow:0 0 0 8px rgba(201,168,92,.08),0 18px 50px rgba(0,0,0,.35)}
#splash .sp-disco img{width:112px;height:112px}
#splash .sp-nom{font:700 15px/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.32em;color:#fff;text-indent:.32em}
#splash .sp-sub{font:500 12px/1 "Plus Jakarta Sans",system-ui,sans-serif;color:rgba(255,255,255,.6);margin-top:-12px}
#splash .sp-bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#splash .sp-bar i{display:block;width:40%;height:100%;background:#c9a85c;border-radius:2px;animation:sp 1.1s ease-in-out infinite}
@keyframes sp{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#splash .sp-bar i{animation:none;width:100%}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css?v=2.11.0">
<script>try{var t=localStorage.getItem("cc_tema");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-disco"><img src="img/logo-blanco.png" alt=""></div><div class="sp-nom">CARCLASS CORE</div><div class="sp-sub">Carclass Group</div><div class="sp-bar"><i></i></div></div>
<script>(function(){var s=document.getElementById("splash"),a,ok=false,t0=Date.now();function fin(){if(ok)return;ok=true;setTimeout(function(){s.classList.add("fuera");setTimeout(function(){s.remove();},500);},Math.max(0,600-(Date.now()-t0)));}
document.addEventListener("DOMContentLoaded",function(){a=document.getElementById("app");if(a.children.length)return fin();new MutationObserver(function(m,o){if(a.children.length){o.disconnect();fin();}}).observe(a,{childList:true});});setTimeout(fin,8000);})();</script>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/supabase.js?v=2.45.4"></script>
<script src="informe-tasacion.js?v=2.11.0"></script>
<script src="app.js?v=2.11.0"></script>
</body>
</html>
